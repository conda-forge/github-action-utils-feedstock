schema_version: 1

context:
  name: github-action-utils
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 4e5c3dc3df2ba976eeb3b9383bfba547ab8d7318a0f941c276ff766668b5754e

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >=0.13.1,<0.14
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - github_action_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Collection of python functions that can be used to run GitHub Action Workflow Commands
  license: MIT
  license_file:
    - LICENSE
  homepage: https://github.com/saadmk11/github-action-utils

extra:
  recipe-maintainers:
    - thewchan
