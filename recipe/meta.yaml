{% set name = "github-action-utils" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 4e5c3dc3df2ba976eeb3b9383bfba547ab8d7318a0f941c276ff766668b5754e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - uv-build >=0.13.1,<0.14
  run:
    - python >={{ python_min }}

test:
  imports:
    - github_action_utils
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/saadmk11/github-action-utils
  summary: Collection of python functions that can be used to run GitHub Action Workflow Commands
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - thewchan
